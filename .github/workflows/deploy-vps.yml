name: Deploy to BTM VPS (manuell nach Review)

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Produktionsänderungen und separat verwaltete VPS-PDFs geprüft
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: btm-production-deploy
  cancel-in-progress: false

jobs:
  quality:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Start static preview for link tests
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 > "$RUNNER_TEMP/btm-preview.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/btm-preview.pid"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/btm-preview.log"
          echo "Static preview konnte nicht gestartet werden." >&2
          exit 1

      - name: Test SEO and public links
        env:
          LINKTEST_BASE_URL: http://127.0.0.1:4173
        run: npm run check:seo

      - name: Stop static preview
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/btm-preview.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/btm-preview.pid")" 2>/dev/null || true
          fi

  deploy:
    name: Sync and restart Docker stack
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirm_deploy }}" = "true" || { echo "Deployment wurde nicht bestätigt." >&2; exit 1; }
          test "$GITHUB_REF_NAME" = "main" || { echo "Deployments sind nur vom main-Branch erlaubt." >&2; exit 1; }
          test -n "$VPS_HOST" || { echo "VPS_HOST fehlt in den production-Environment-Secrets." >&2; exit 1; }
          test -n "$VPS_USER" || { echo "VPS_USER fehlt in den production-Environment-Secrets." >&2; exit 1; }
          test -n "$VPS_APP_PATH" || { echo "VPS_APP_PATH fehlt in den production-Environment-Secrets." >&2; exit 1; }
          test -n "$VPS_SSH_PRIVATE_KEY" || { echo "VPS_SSH_PRIVATE_KEY fehlt in den GitHub Secrets." >&2; exit 1; }
          test -n "$VPS_SSH_KNOWN_HOSTS" || { echo "VPS_SSH_KNOWN_HOSTS fehlt in den GitHub Secrets." >&2; exit 1; }
          test "$VPS_USER" != "root" || { echo "VPS_USER darf nicht root sein. Verwende einen dedizierten Deploy-Benutzer." >&2; exit 1; }
          case "$VPS_PORT" in (*[!0-9]*|'') echo "VPS_PORT muss numerisch sein." >&2; exit 1;; esac
          test "$VPS_APP_PATH" = "/opt/btm" || { echo "Unerwarteter VPS_APP_PATH: $VPS_APP_PATH" >&2; exit 1; }

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/btm_deploy_key"
          chmod 600 "$HOME/.ssh/btm_deploy_key"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Synchronize application files
        shell: bash
        run: |
          set -euo pipefail
          # Dieser Ordner wird separat auf dem VPS gepflegt und darf nicht überschrieben werden.
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.DS_Store' \
            --exclude='frontend/node_modules/' \
            --exclude='frontend/dist/' \
            --exclude='frontend/dist-server/' \
            --exclude='frontend/.env*' \
            --exclude='backend/vendor/' \
            --exclude='backend/var/' \
            --exclude='backend/.env' \
            --exclude='frontend/public/pdfs/' \
            --exclude='.env' \
            -e "ssh -i $HOME/.ssh/btm_deploy_key -p $VPS_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            ./ "$VPS_USER@$VPS_HOST:$VPS_APP_PATH/"

      - name: Build and restart on VPS
        shell: bash
        run: |
          set -euo pipefail
          remote_path=$(printf '%q' "$VPS_APP_PATH")
          ssh -i "$HOME/.ssh/btm_deploy_key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" "VPS_APP_PATH=$remote_path bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$VPS_APP_PATH"

          if [ ! -f backend/.env ]; then
            echo "backend/.env fehlt auf dem VPS. Lege die Produktions-Konfiguration einmalig unter $VPS_APP_PATH/backend/.env an." >&2
            exit 1
          fi

          if grep -Eq '^(APP_SECRET|ADMIN_PASSWORD_HASH)=replace-with-' backend/.env; then
            echo "backend/.env enthält noch Platzhalter. Setze APP_SECRET und ADMIN_PASSWORD_HASH vor dem Deployment." >&2
            exit 1
          fi

          docker compose -f docker-compose.prod.yml version
          docker compose -f docker-compose.prod.yml config >/dev/null
          docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5173/ >/dev/null \
              && curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5173/api/auth/session >/dev/null \
              && curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8000/api/health >/dev/null; then
              echo "BTM-Stack ist erreichbar."

              for path in \
                /sitemap.xml \
                /llms.txt \
                /llms-full.txt \
                /full-llms.txt \
                /pdfs/index.html \
                /login \
                /registrieren \
                /konto \
                '/passwort-zuruecksetzen?token=link-test'; do
                curl --fail --silent --show-error --max-time 10 "http://127.0.0.1:5173$path" >/dev/null \
                  || { echo "Live-Linktest fehlgeschlagen: $path" >&2; exit 1; }
              done

              unknown_status=$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:5173/does-not-exist)
              test "$unknown_status" = "404" || { echo "Unbekannte Route liefert HTTP $unknown_status statt 404." >&2; exit 1; }

              docker compose -f docker-compose.prod.yml ps
              exit 0
            fi
            sleep 2
          done

          docker compose -f docker-compose.prod.yml ps
          echo "Health-Check nach dem Deployment fehlgeschlagen." >&2
          exit 1
          REMOTE
