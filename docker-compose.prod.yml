services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        VITE_SITE_URL: https://btm.shortaktien.de
    expose:
      - "80"
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
