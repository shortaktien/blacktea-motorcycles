services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        VITE_SITE_URL: https://btm.shortaktien.de
    expose:
      - "80"
      - "5173"
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      APP_RUNTIME_OPTIONS: '{"disable_dotenv":true}'
    volumes:
      - type: bind
        source: /opt/btm-runtime/data
        target: /app/var/data
        bind:
          create_host_path: false
      - type: bind
        source: /opt/btm-runtime/uploads
        target: /app/var/uploads
        bind:
          create_host_path: false
      - type: bind
        source: /opt/btm-runtime/sessions
        target: /app/var/sessions
        bind:
          create_host_path: false
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
